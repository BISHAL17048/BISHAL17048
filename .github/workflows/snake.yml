name: Generate Snake Animation

on:
  schedule:
    - cron: "0 */12 * * *" 
  workflow_dispatch:
  push:
    branches:
    - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3
      
      - uses: Platane/snk@v3
        with:
          github_user_name: bishal17048
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-light&color_snake=%23ff3d00&color_dots=%23ebedf0,%23dcedc8,%23aed581,%237cb342,%23558b2f
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%23ffeb3b&color_dots=%23161b22,%231b5e20,%232e7d32,%234caf50,%2381c784
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}
          
      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
