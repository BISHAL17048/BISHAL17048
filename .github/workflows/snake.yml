name: Generate Snake Animation

on:
  schedule:
    - cron: "0 */12 * * *" 
  workflow_dispatch:
  push:
    branches:
    - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3
      
      - uses: Platane/snk@v3
        with:
          github_user_name: bishal17048
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-light&color_snake=%23ff6b6b&color_dots=%23ebedf0,%238dbdff,%2364a1f4,%234b91f1,%233c7dd9
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%2300ffcc&color_dots=%23161b22,%23013e7d,%235200a3,%23a100f2,%23f70094
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}
          
      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
